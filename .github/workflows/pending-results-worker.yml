name: Grap-AI pending result evaluator

on:
  push:
    branches: [main]
    paths:
      - "scripts/evaluate-pending-results.cjs"
      - "js/denetci-fiyat-tahmini.js"
      - ".github/workflows/pending-results-worker.yml"
      - ".github/tests/pending-results-worker-smoke.cjs"
      - ".github/tests/five-candle-forecast-smoke.cjs"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      retry_data_errors:
        description: "Daha önce veri hatası alan kayıtları bekleme süresini atlayarak yeniden dene"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: grap-ai-pending-results
  cancel-in-progress: false

jobs:
  evaluate-pending-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Smoke test auditor five-candle forecast
        run: node .github/tests/five-candle-forecast-smoke.cjs

      - name: Smoke test pending-result worker
        run: node .github/tests/pending-results-worker-smoke.cjs

      - name: Probe alternative public crypto candle providers
        if: github.event_name == 'push'
        continue-on-error: true
        run: node .github/tests/crypto-provider-probe.cjs

      - name: Evaluate pending shared signals
        env:
          SUPABASE_URL: https://qkkhguyngmsddnkunyws.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETRY_DATA_ERRORS: ${{ github.event_name == 'push' || inputs.retry_data_errors || false }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is missing."
            exit 1
          fi
          node scripts/evaluate-pending-results.cjs
