name: Browser end-to-end test

on:
  push:
    branches: [main]
    paths:
      - ".github/tests/**"
      - ".github/workflows/live-e2e.yml"
      - "index.html"
      - "js/**"
      - "css/**"
      - "sw.js"
  pull_request:
    branches: [main]
    paths:
      - ".github/tests/**"
      - ".github/workflows/live-e2e.yml"
      - "index.html"
      - "js/**"
      - "css/**"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local Graph AI server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/graph-ai-http.log 2>&1 &
          echo $! > /tmp/graph-ai-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Graph AI local server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/graph-ai-http.log
          exit 1

      - name: Test checked-out Graph AI in Chromium
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node .github/tests/live-e2e.mjs

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-ai-live-e2e-report
          path: |
            live-e2e-report.json
            live-e2e-failure.png
          if-no-files-found: ignore
          retention-days: 7
