name: Browser end-to-end test

on:
  push:
    branches: [main]
    paths:
      - ".github/tests/**"
      - ".github/workflows/live-e2e.yml"
      - "index.html"
      - "binance-api-check.html"
      - "js/**"
      - "css/**"
      - "sw.js"
  pull_request:
    branches: [main]
    paths:
      - ".github/tests/**"
      - ".github/workflows/live-e2e.yml"
      - "index.html"
      - "binance-api-check.html"
      - "js/**"
      - "css/**"
      - "sw.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Smoke test crypto agents
        run: node .github/tests/crypto-agent-smoke.cjs

      - name: Validate browser Binance diagnostic page
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('binance-api-check.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          assert.equal(scripts.length, 1, 'Expected one inline diagnostic script');
          new Function(scripts[0][1]);
          for (const endpoint of ['premiumIndex', 'openInterest', 'openInterestHist', 'globalLongShortAccountRatio', 'takerlongshortRatio']) {
            assert.ok(html.includes(endpoint), 'Missing endpoint: ' + endpoint);
          }
          console.log('PASS browser Binance diagnostic page syntax and endpoint coverage');
          NODE

      - name: Probe live Binance Spot and USD-M Futures APIs
        continue-on-error: true
        run: node .github/tests/binance-live-api.cjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local Graph AI server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/graph-ai-http.log 2>&1 &
          echo $! > /tmp/graph-ai-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Graph AI local server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/graph-ai-http.log
          exit 1

      - name: Test checked-out Graph AI in Chromium
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node .github/tests/live-e2e.mjs

      - name: Upload browser and live API reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graph-ai-live-e2e-report
          path: |
            live-e2e-report.json
            live-e2e-failure.png
            binance-live-api-report.json
          if-no-files-found: ignore
          retention-days: 7
